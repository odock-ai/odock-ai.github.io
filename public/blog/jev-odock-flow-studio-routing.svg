<svg width="1200" height="690" viewBox="0 0 1200 690" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">System One decisions inside the Odock gateway</title>
  <desc id="d">An application request enters Odock. At pre-route, a Run Plugin node masks PII, an HTTP Request node asks Jev a typed routing question, and a Switch node sends the request to a small model, a frontier model, or a human approval path. A post-response graph scores the result asynchronously.</desc>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
  <rect width="1200" height="690" fill="#F8FAFC"/>
  <text x="600" y="52" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">System One decisions inside the Odock gateway</text>
  <text x="600" y="84" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">Jev answers a typed question in milliseconds; Flow Studio acts on the answer</text>
  <rect x="40" y="170" width="170" height="150" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="125" y="215" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Apps &amp; agents</text>
  <text x="125" y="248" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Support bot</text>
  <text x="125" y="274" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Internal copilot</text>
  <text x="125" y="300" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" text-anchor="middle">Agent workers</text>
  <rect x="250" y="130" width="640" height="520" rx="14" fill="#0F172A" stroke="#2563EB" stroke-width="3"/>
  <rect x="250" y="130" width="640" height="40" rx="14" fill="#111827"/>
  <rect x="250" y="156" width="640" height="14" fill="#111827"/>
  <circle cx="274" cy="150" r="6" fill="#F87171"/>
  <circle cx="296" cy="150" r="6" fill="#FBBF24"/>
  <circle cx="318" cy="150" r="6" fill="#38BDF8"/>
  <text x="570.0" y="156" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">odock gateway · Flow Studio</text>
  <text x="570" y="205" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Pre-route graph (sequential lane)</text>
  <rect x="300" y="225" width="260" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="430" y="257" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Run Plugin: pii_mask</text>
  <text x="430" y="281" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">minimise state before it leaves</text>
  <line x1="430" y1="299" x2="430" y2="325" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="300" y="325" width="260" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="430" y="357" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">HTTP Request → Jev</text>
  <text x="430" y="381" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Choice + confidence, ~100 ms</text>
  <line x1="430" y1="399" x2="430" y2="425" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="300" y="425" width="260" height="74" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <text x="430" y="457" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Switch on decision</text>
  <text x="430" y="481" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">vars.route · vars.confidence</text>
  <rect x="610" y="225" width="240" height="74" rx="10" fill="#052E16" stroke="#16A34A" stroke-width="2"/>
  <text x="730" y="257" fill="#BBF7D0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Route Model: small</text>
  <text x="730" y="281" fill="#BBF7D0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">simple &amp; confident</text>
  <rect x="610" y="325" width="240" height="74" rx="10" fill="#172554" stroke="#2563EB" stroke-width="2"/>
  <text x="730" y="357" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Route Model: frontier</text>
  <text x="730" y="381" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">complex or low confidence</text>
  <rect x="610" y="425" width="240" height="74" rx="10" fill="#451A03" stroke="#D97706" stroke-width="2"/>
  <text x="730" y="457" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Abort / approval</text>
  <text x="730" y="481" fill="#FDE68A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">unsure → human path</text>
  <line x1="560" y1="462" x2="608" y2="262" stroke="#16A34A" stroke-width="2.5" marker-end="url(#a-green)"/>
  <line x1="560" y1="462" x2="608" y2="362" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <line x1="560" y1="462" x2="608" y2="462" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-amber)"/>
  <rect x="300" y="540" width="550" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="575" y="572" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="middle">Post-response graph (async lane)</text>
  <text x="575" y="598" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">Jev Score on output quality → webhook to warehouse</text>
  <line x1="210" y1="255" x2="298" y2="262" stroke="#475569" stroke-width="2.5" marker-end="url(#a-muted)"/>
  <rect x="30" y="400" width="200" height="150" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
  <text x="130" y="440" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">TypeSafe Jev</text>
  <text x="130" y="464" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">decision model</text>
  <text x="130" y="500" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">typed answers +</text>
  <text x="130" y="520" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">probabilities,</text>
  <text x="130" y="540" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle">no generated text</text>
  <line x1="298" y1="362" x2="234" y2="430" stroke="#D97706" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a-amber)"/>
  <rect x="940" y="190" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1050" y="232" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Small model</text>
  <text x="1050" y="262" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">cheap, fast tier</text>
  <text x="1050" y="288" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">e.g. mini / open-weight</text>
  <rect x="940" y="330" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1050" y="372" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Frontier model</text>
  <text x="1050" y="402" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">reasoning tier</text>
  <text x="1050" y="428" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">only when needed</text>
  <rect x="940" y="470" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1050" y="512" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Human review</text>
  <text x="1050" y="542" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">approval service</text>
  <text x="1050" y="568" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">or clear 4xx message</text>
  <line x1="850" y1="262" x2="938" y2="245" stroke="#16A34A" stroke-width="2.5" marker-end="url(#a-green)"/>
  <line x1="850" y1="362" x2="938" y2="385" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <line x1="850" y1="462" x2="938" y2="525" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-amber)"/>
</svg>
