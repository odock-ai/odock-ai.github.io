  <text x="600" y="84" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">Faire passer chaque agent de code par une seule gateway, puis relier la dépense à ce qui est livré</text>
