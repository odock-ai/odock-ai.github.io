<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Les cinq questions de la supervision d'agents</title>
  <desc id="d">Cinq questions de supervision reliées aux contrôles Odock : qui a initié l'action (principals des virtual API keys et headers d'identité agent), ce que l'agent a fait (usage records, usage records MCP, traces de flow), quelles données il a touchées (redaction SafetySec, pii_mask, filtres sémantiques), combien cela a coûté (réservation de budget avant l'appel, quotas), et si on peut l'arrêter (nœuds Abort, gates d'approbation, plafond de boucles, révocation de clé). Un request id commun relie la chaîne de traçabilité.</desc>
  <defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker></defs>
  <rect width="1200" height="780" fill="#F8FAFC"/>
  <text x="600" y="52" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">Les cinq questions de la supervision d'agents</text>
  <text x="600" y="84" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" text-anchor="middle">…et d'où vient chaque réponse quand le trafic agent passe par Odock</text>
  <text x="250" y="132" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Question de supervision</text>
  <text x="790" y="132" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Contrôle Odock qui y répond</text>
  <rect x="60" y="150" width="380" height="92" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="250" y="204" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Qui l'a initié ?</text>
  <line x1="440" y1="196" x2="498" y2="196" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="500" y="150" width="640" height="92" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="520" y="188" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Principal de la virtual API key</text>
  <text x="520" y="216" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">org · équipe · utilisateur · clé  +  header x-odock-agent-id</text>
  <rect x="60" y="258" width="380" height="92" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="250" y="312" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Qu'a-t-il fait ?</text>
  <line x1="440" y1="304" x2="498" y2="304" stroke="#2563EB" stroke-width="2.5" marker-end="url(#a-blue)"/>
  <rect x="500" y="258" width="640" height="92" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="520" y="296" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Usage records et traces de flow</text>
  <text x="520" y="324" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">modèle, serveur MCP, outil, statut, trace de routage, nœuds</text>
  <rect x="60" y="366" width="380" height="92" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2.5"/>
  <text x="250" y="420" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Quelles données ?</text>
  <line x1="440" y1="412" x2="498" y2="412" stroke="#D97706" stroke-width="2.5" marker-end="url(#a-amber)"/>
  <rect x="500" y="366" width="640" height="92" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="520" y="404" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">SafetySec · pii_mask · filtres sémantiques</text>
  <text x="520" y="432" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">masquer avant sortie, inspecter payloads et réponses</text>
  <rect x="60" y="474" width="380" height="92" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.5"/>
  <text x="250" y="528" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Combien ça coûte ?</text>
  <line x1="440" y1="520" x2="498" y2="520" stroke="#16A34A" stroke-width="2.5" marker-end="url(#a-green)"/>
  <rect x="500" y="474" width="640" height="92" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="520" y="512" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Budgets et quotas</text>
  <text x="520" y="540" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">coût estimé réservé avant l'appel, réglé après</text>
  <rect x="60" y="582" width="380" height="92" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5"/>
  <text x="250" y="636" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Peut-on l'arrêter ?</text>
  <line x1="440" y1="628" x2="498" y2="628" stroke="#DC2626" stroke-width="2.5" marker-end="url(#a-red)"/>
  <rect x="500" y="582" width="640" height="92" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <text x="520" y="620" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Abort · gate d'approbation · plafond</text>
  <text x="520" y="648" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">blocage inline, fail closed, révoquer ou faire tourner la clé</text>
  <rect x="60" y="694" width="1080" height="66" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
  <text x="600" y="734" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Traçabilité : un request id gateway commun aux usage records, logs, métriques et traces OTel</text>
</svg>
