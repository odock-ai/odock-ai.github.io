  <text x="150" y="180" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">Coding agents</text>
  <text x="150" y="214" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Claude Code</text>
  <text x="150" y="239" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Codex-style CLIs</text>
  <text x="150" y="264" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">IDE assistants</text>
  <text x="150" y="289" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">PR review bots</text>
  <text x="150" y="314" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">CI agents</text>
